# ══════════════════════════════════════════════════════════════════
# Life on Campus — Event Reminder Notifications
#
# Runs every hour. Each run checks:
#   • Any event starting in ~1 hour  → sends the "starting soon" push
#   • Any event starting in ~24 hours → sends the "tomorrow" push
# Each subscriber gets exactly 2 reminders per event they're interested
# in: one 24h before, one 1h before. No extra/duplicate pushes.
#
# HOW TO SET THIS UP (one time only):
#   1. In your GitHub repository, create the folder structure:
#      .github/workflows/
#   2. Save this file as:
#      .github/workflows/event-reminders.yml
#   3. Commit and push to GitHub
#   4. GitHub will start running this automatically — no other setup needed
#
# TO TEST MANUALLY:
#   Go to GitHub repo → Actions → Event Reminder Notifications → Run workflow
# ══════════════════════════════════════════════════════════════════

name: Event Reminder Notifications

on:
  schedule:
    # Runs every hour, on the hour
    - cron: '0 * * * *'

  # Allows you to run this manually from the GitHub Actions tab for testing
  workflow_dispatch:

env:
  # Public "publishable" key — safe to store here, same one used on the website.
  SUPABASE_ANON_KEY: sb_publishable_77t5gCD7M620CzcMwESN-A_oAuqz6B8

jobs:
  hourly-event-reminder:
    name: 1-Hour Event Reminder
    runs-on: ubuntu-latest

    steps:
      - name: Notify subscribers of events starting soon
        run: |
          curl -sf -o /dev/null -w "Status: %{http_code}\n" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -d '{"type":"check_reminders"}' \
            "https://dgzuqvffnbfybngoadse.supabase.co/functions/v1/bright-processor"

  daily-advance-reminder:
    name: 24-Hour Advance Reminder
    runs-on: ubuntu-latest

    steps:
      - name: Notify subscribers of events happening in ~24 hours
        run: |
          curl -sf -o /dev/null -w "Status: %{http_code}\n" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -d '{"type":"reminder_24h"}' \
            "https://dgzuqvffnbfybngoadse.supabase.co/functions/v1/bright-processor"
