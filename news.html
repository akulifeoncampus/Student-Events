<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="theme-color" content="#000060" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Life on Campus" />

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ===== DESIGN TOKENS ===== */
    :root {
      --aku-navy:       #000060;
      --aku-navy-dark:  #00004a;
      --aku-navy-light: rgba(0,0,96,.06);
      --aku-blue:       #2563eb;
      --color-bg:        #f4f6f9;
      --color-surface:   #ffffff;
      --color-surface-2: #f8fafc;
      --color-border:    #e2e8f0;
      --color-border-2:  #cbd5e1;
      --color-ink:   #0f172a;
      --color-muted: #64748b;
      --color-hint:  #94a3b8;
      --color-accent:     #2563eb;
      --color-accent-bg:  #eff6ff;
      --color-danger:     #ef4444;
      --color-danger-bg:  #fef2f2;
      --color-success:    #10b981;
      --color-success-bg: #f0fdf4;
      --color-warning:    #f59e0b;
      --color-warning-bg: #fffbeb;
      --radius-sm:   6px;
      --radius-md:   10px;
      --radius-lg:   16px;
      --radius-xl:   24px;
      --radius-pill: 9999px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,.08);
      --shadow-lg: 0 16px 40px rgba(0,0,0,.12);
      --text-xs:   11px;
      --text-sm:   12px;
      --text-base: 13px;
      --text-md:   14px;
      --text-lg:   18px;
      --text-xl:   24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    input, select, button, textarea { font-family: inherit; }
    body { font-family: 'Poppins', sans-serif; background: var(--color-bg); color: var(--color-ink); }

    /* ===== TOPBAR ===== */
    .topbar {
      height: 56px;
      background: var(--aku-navy);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 0 rgba(255,255,255,.06);
    }
    .brand { color: white; font-size: 17px; font-weight: 700; letter-spacing: .2px; }
    .nav-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      color: white;
      border-radius: var(--radius-sm);
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .nav-toggle:focus-visible { outline: 2px solid rgba(255,255,255,.5); outline-offset: 2px; }

    /* ===== SHELL ===== */
    .shell {
      display: grid;
      grid-template-columns: 160px 1fr;
      min-height: calc(100vh - 56px);
    }

    /* ===== SIDEBAR ===== */
    .nav {
      background: var(--color-surface);
      border-right: 0.5px solid var(--color-border);
      padding: 16px 8px;
    }
    .nav a {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      margin: 1px 0;
      border-radius: var(--radius-md);
      color: var(--color-muted);
      text-decoration: none;
      font-size: var(--text-base);
      font-weight: 500;
      transition: background .15s, color .15s;
    }
    .nav a:hover:not(.active) { background: var(--color-bg); color: var(--color-ink); }
    .nav a.active {
      background: var(--aku-navy-light);
      color: var(--aku-navy);
      font-weight: 600;
      border-left: 3px solid var(--aku-navy);
      padding-left: 9px;
    }
    .nav a.hub-link { color: #7c3aed; font-weight: 700; }
    .nav a.hub-link:hover { background: #f5f3ff; }
    .nav a:focus-visible { outline: 2px solid var(--aku-navy); outline-offset: 2px; }

    /* ===== CONTENT ===== */
    .content { padding: 24px; }

    /* ===== PAGE HEADER ===== */
    .page-header { margin-bottom: 24px; }
    .page-title { font-size: var(--text-xl); font-weight: 700; color: var(--color-ink); margin-bottom: 4px; }
    .page-subtitle { font-size: var(--text-md); color: var(--color-muted); }

    /* ===== FILTER BAR ===== */
    .filter-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      align-items: center;
    }
    .filter-bar input {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: var(--text-base);
      color: var(--color-ink);
      background: var(--color-surface);
      box-shadow: var(--shadow-sm);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .filter-bar input:focus {
      border-color: var(--aku-navy);
      box-shadow: 0 0 0 3px var(--aku-navy-light);
    }
    .filter-bar input::placeholder { color: var(--color-hint); }
    .filter-bar select {
      padding: 10px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: var(--text-base);
      color: var(--color-ink);
      background: var(--color-surface);
      box-shadow: var(--shadow-sm);
      outline: none;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .filter-bar select:focus {
      border-color: var(--aku-navy);
      box-shadow: 0 0 0 3px var(--aku-navy-light);
    }

    /* ===== CATEGORY CHIPS ===== */
    .cat-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .cat-pill {
      padding: 5px 14px;
      border-radius: 4px;
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      cursor: pointer;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-muted);
      transition: all .15s;
    }
    .cat-pill:hover:not(.active) { background: var(--color-bg); color: var(--color-ink); border-color: var(--color-border-2); }
    .cat-pill.active { background: var(--aku-navy); color: white; border-color: var(--aku-navy); }
    .cat-pill:focus-visible { outline: 2px solid var(--aku-navy); outline-offset: 2px; }

    /* ===== PINNED / FEATURED ARTICLE ===== */
    .pinned-article {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      border: 0.5px solid var(--color-border);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      margin-bottom: 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      cursor: pointer;
      transition: transform .18s, box-shadow .18s;
      text-decoration: none;
      color: inherit;
    }
    .pinned-article:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .pinned-img { width: 100%; height: 320px; object-fit: cover; }
    .pinned-img-placeholder {
      width: 100%;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
    }
    .pinned-body {
      padding: 32px 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .pinned-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--color-accent);
      margin-bottom: 12px;
    }
    .pinned-title { font-size: 22px; font-weight: 700; line-height: 1.35; margin-bottom: 12px; color: var(--color-ink); }
    .pinned-subtitle { font-size: var(--text-md); color: var(--color-muted); line-height: 1.6; margin-bottom: 20px; }
    .pinned-meta { font-size: var(--text-sm); color: var(--color-muted); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .pinned-read-more {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      font-size: var(--text-base);
      font-weight: 600;
      color: var(--color-accent);
    }

    /* ===== NEWS GRID ===== */
    .news-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

    /* ===== NEWS CARD ===== */
    .news-card {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      border: 0.5px solid var(--color-border);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform .18s, box-shadow .18s;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }
    .news-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .news-card:focus-visible { outline: 2px solid var(--aku-navy); outline-offset: 2px; }
    .news-card-img { width: 100%; height: 190px; object-fit: cover; }
    .news-card-img-placeholder {
      width: 100%;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    .news-card-body { padding: 14px 16px 18px; flex: 1; display: flex; flex-direction: column; }
    .news-card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .tag-badge {
      font-size: var(--text-xs);
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .tag-achievement  { background: #fef3c7; color: #92400e; }
    .tag-announcement { background: var(--color-accent-bg); color: #1d4ed8; }
    .tag-eventrecap   { background: var(--color-success-bg); color: #15803d; }
    .tag-opportunity  { background: #fdf4ff; color: #7e22ce; }
    .tag-other        { background: var(--color-surface-2); color: var(--color-muted); }
    .tag-campus       { background: #f0f9ff; color: #0369a1; }

    .news-card-title {
      font-size: var(--text-md);
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 8px;
      color: var(--color-ink);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .news-card-subtitle {
      font-size: var(--text-base);
      color: var(--color-muted);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 14px;
      flex: 1;
    }
    .news-card-meta {
      font-size: var(--text-xs);
      color: var(--color-hint);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 12px;
      border-top: 0.5px solid var(--color-border);
    }

    /* ===== RESULT COUNT ===== */
    .result-count { font-size: var(--text-sm); color: var(--color-muted); margin-bottom: 16px; }

    /* ===== EMPTY STATE ===== */
    .empty-state { text-align: center; padding: 64px 20px; color: var(--color-muted); }
    .empty-icon { font-size: 32px; opacity: .5; margin-bottom: 12px; }
    .empty-text { font-size: var(--text-md); }

    /* ===== ARTICLE MODAL ===== */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.45);
      backdrop-filter: blur(2px);
      z-index: 500;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px;
      overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }
    .article-modal {
      background: var(--color-surface);
      border-radius: var(--radius-xl);
      border-top: 3px solid var(--aku-navy);
      width: 100%;
      max-width: 740px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      margin: auto;
    }
    .article-cover { width: 100%; height: 320px; object-fit: cover; }
    .article-cover-placeholder {
      width: 100%;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
    }
    .article-body { padding: 28px 32px 36px; }
    .article-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .article-title { font-size: 24px; font-weight: 700; line-height: 1.3; margin-bottom: 10px; color: var(--color-ink); }
    .article-subtitle { font-size: var(--text-lg); color: var(--color-muted); line-height: 1.6; margin-bottom: 18px; }
    .article-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: var(--text-base);
      color: var(--color-muted);
      padding-bottom: 20px;
      border-bottom: 0.5px solid var(--color-border);
      margin-bottom: 24px;
    }
    .article-meta span { display: flex; align-items: center; gap: 5px; }
    .article-content { font-size: 15px; line-height: 1.8; color: var(--color-ink); }
    .article-content p { margin-bottom: 16px; }
    .article-content ul, .article-content ol { padding-left: 20px; margin-bottom: 16px; }
    .article-content li { margin-bottom: 6px; }
    .article-content a { color: var(--color-accent); }
    .article-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(15,23,42,.55);
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: background .15s;
    }
    .article-close:hover { background: rgba(15,23,42,.8); }
    .article-close:focus-visible { outline: 2px solid white; outline-offset: 2px; }
    .article-modal-wrap { position: relative; }

    /* ===== SKELETON LOADER ===== */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position:  400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius-md);
    }

    /* ===== CARD FADE-IN ===== */
    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: cardFadeIn .3s ease forwards; }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--color-surface);
      border-top: 0.5px solid var(--color-border);
      box-shadow: 0 -2px 8px rgba(0,0,0,.06);
      z-index: 200;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-nav-inner { display: flex; align-items: center; }
    .bottom-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      color: var(--color-muted);
      font-size: 9px;
      font-weight: 600;
      padding: 8px 2px 6px;
      transition: color .15s;
    }
    .bottom-nav-item.active { color: var(--aku-navy); }
    .bottom-nav-item.hub { color: #7c3aed; }
    .bottom-nav-item:focus-visible { outline: 2px solid var(--aku-navy); outline-offset: -2px; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1100px) {
      .news-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 1024px) {
      .shell { grid-template-columns: 1fr; }
      .nav {
        display: none;
        position: fixed;
        top: 56px; left: 0;
        width: 220px;
        height: calc(100vh - 56px);
        z-index: 200;
        box-shadow: var(--shadow-lg);
        overflow-y: auto;
      }
      .nav.open { display: block; }
      .nav-toggle { display: flex; }
      .content { padding: 18px; }
      .pinned-article { grid-template-columns: 1fr; }
      .pinned-img, .pinned-img-placeholder { height: 220px; }
    }
    @media (max-width: 768px) {
      .bottom-nav { display: block; }
      .content { padding-bottom: 88px; }
    }
    @media (max-width: 640px) {
      .news-grid { grid-template-columns: 1fr; }
      .content { padding: 14px 14px 88px; }
      .page-title { font-size: var(--text-lg); }
      .article-body { padding: 20px 20px 28px; }
      .article-title { font-size: 20px; }
      .pinned-body { padding: 20px; }
      .pinned-title { font-size: var(--text-lg); }
    }
  </style>
</head>

  <main class="content">
    <div class="page-header">
      <div class="page-title">News &amp; Updates</div>
      <div class="page-subtitle" id="newsSub">Latest stories, achievements and announcements from AKU campuses</div>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar">
      <input id="searchInput" type="text" placeholder="Search news…" aria-label="Search news" />
      <select id="campusSelect" aria-label="Filter by campus">
        <option value="">All Campuses</option>
        <option value="Karachi">Karachi</option>
        <option value="Nairobi">Nairobi</option>
        <option value="Kampala">Kampala</option>
        <option value="Dar es Salaam">Dar es Salaam</option>
      </select>
    </div>

    <!-- Category chips -->
    <div class="cat-pills" role="group" aria-label="Filter by category">
      <button class="cat-pill active" data-cat="">All</button>
      <button class="cat-pill" data-cat="Achievement">🏆 Achievement</button>
      <button class="cat-pill" data-cat="Announcement">📢 Announcement</button>
      <button class="cat-pill" data-cat="Event Recap">🎉 Event Recap</button>
      <button class="cat-pill" data-cat="Opportunity">💡 Opportunity</button>
      <button class="cat-pill" data-cat="Other">📌 Other</button>
    </div>

    <!-- Pinned article -->
    <div id="pinnedWrap"></div>

    <!-- Result count -->
    <div class="result-count" id="resultCount" aria-live="polite"></div>

    <!-- News grid -->
    <div id="newsGrid" class="news-grid"></div>

    <!-- Empty state -->
    <div id="emptyState" style="display:none;">
      <div class="empty-state">
        <div class="empty-icon">📰</div>
        <div class="empty-text">No articles found.</div>
      </div>
    </div>
  </main>
</div>

<!-- Article modal -->
<div class="modal-backdrop" id="articleModal" role="dialog" aria-modal="true" aria-label="Article">
  <div class="article-modal-wrap">
    <button class="article-close" onclick="closeArticle()" aria-label="Close article">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 6l-12 12"/><path d="M6 6l12 12"/>
      </svg>
    </button>
    <div class="article-modal" id="articleModalContent"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://dgzuqvffnbfybngoadse.supabase.co";
const SUPABASE_KEY = "sb_publishable_77t5gCD7M620CzcMwESN-A_oAuqz6B8";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: "aku-public-session", persistSession: false } });

/* ── Nav toggle ── */
const navToggle = document.getElementById("navToggle");
const sideNav   = document.getElementById("sideNav");
navToggle.addEventListener("click", () => {
  const isOpen = sideNav.classList.toggle("open");
  navToggle.setAttribute("aria-expanded", String(isOpen));
});
document.addEventListener("click", e => {
  if(sideNav.classList.contains("open") && !sideNav.contains(e.target) && e.target !== navToggle)
    sideNav.classList.remove("open");
});

/* ── State ── */
let allArticles = [];
let activeCategory = "";
let activeCampus   = "";
let searchQuery    = "";

const CATEGORY_COLORS = {
  "Achievement":  { cls:"tag-achievement",  emoji:"🏆" },
  "Announcement": { cls:"tag-announcement", emoji:"📢" },
  "Event Recap":  { cls:"tag-eventrecap",   emoji:"🎉" },
  "Opportunity":  { cls:"tag-opportunity",  emoji:"💡" },
  "Other":        { cls:"tag-other",        emoji:"📌" },
};

const PLACEHOLDER_EMOJIS = {
  "Achievement":"🏆", "Announcement":"📢", "Event Recap":"🎉", "Opportunity":"💡", "Other":"📰"
};

const CAMPUS_GRADIENTS = {
  "Karachi":       "linear-gradient(135deg,#2563eb,#7c3aed)",
  "Nairobi":       "linear-gradient(135deg,#059669,#2563eb)",
  "Kampala":       "linear-gradient(135deg,#d97706,#dc2626)",
  "Dar es Salaam": "linear-gradient(135deg,#7c3aed,#db2777)",
};

function esc(str){
  return String(str ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;");
}

function formatDate(str){
  if(!str) return "";
  return new Date(str).toLocaleDateString("en-GB", { day:"numeric", month:"long", year:"numeric" });
}

function tagClass(cat){
  return CATEGORY_COLORS[cat]?.cls || "tag-other";
}

function placeholderEmoji(cat){
  return PLACEHOLDER_EMOJIS[cat] || "📰";
}

/* ── Load ── */
async function loadNews(){
  document.getElementById("newsSub").textContent = "Loading…";
  const { data, error } = await sb
    .from("news")
    .select("*")
    .eq("published", true)
    .order("pinned", { ascending: false })
    .order("created_at", { ascending: false });

  if(error){
    document.getElementById("newsSub").textContent = "Failed to load news.";
    return;
  }

  allArticles = data || [];
  document.getElementById("newsSub").textContent =
    `Latest stories, achievements and announcements from AKU campuses`;
  render();
}

/* ── Render ── */
function render(){
  const q    = searchQuery.toLowerCase();
  const cat  = activeCategory;
  const camp = activeCampus;

  let list = allArticles
    .filter(a => !cat  || a.category === cat)
    .filter(a => !camp || a.campus === camp || a.campus === "All")
    .filter(a => !q    || `${a.title} ${a.subtitle} ${a.author} ${a.category} ${a.campus} ${a.content}`.toLowerCase().includes(q));

  const pinnedWrap = document.getElementById("pinnedWrap");
  const pinned     = (!cat && !camp && !q) ? list.find(a => a.pinned) : null;
  const gridList   = pinned ? list.filter(a => a.id !== pinned.id) : list;

  if(pinned){
    const bg    = CAMPUS_GRADIENTS[pinned.campus] || "linear-gradient(135deg,#2563eb,#7c3aed)";
    const catInfo = CATEGORY_COLORS[pinned.category] || { cls:"tag-other", emoji:"📌" };
    pinnedWrap.innerHTML = `
      <div class="pinned-article" onclick="openArticle('${pinned.id}')">
        ${pinned.cover_image
          ? `<img class="pinned-img" src="${esc(pinned.cover_image)}" alt="${esc(pinned.title)}" loading="lazy" />`
          : `<div class="pinned-img-placeholder" style="background:${bg}">${placeholderEmoji(pinned.category)}</div>`
        }
        <div class="pinned-body">
          <div class="pinned-tag">
            📌 Featured &nbsp;·&nbsp; ${catInfo.emoji} ${esc(pinned.category || "News")}
          </div>
          <div class="pinned-title">${esc(pinned.title)}</div>
          <div class="pinned-subtitle">${esc(pinned.subtitle || "")}</div>
          <div class="pinned-meta">
            ${pinned.author ? `<span>✍️ ${esc(pinned.author)}</span>` : ""}
            ${pinned.created_at ? `<span>📅 ${formatDate(pinned.created_at)}</span>` : ""}
            ${pinned.campus && pinned.campus !== "All" ? `<span>📍 ${esc(pinned.campus)}</span>` : ""}
          </div>
          <div class="pinned-read-more">Read full story →</div>
        </div>
      </div>`;
  } else {
    pinnedWrap.innerHTML = "";
  }

  document.getElementById("resultCount").textContent =
    list.length ? `Showing ${list.length} article${list.length !== 1 ? "s" : ""}` : "";

  const empty = document.getElementById("emptyState");
  const grid  = document.getElementById("newsGrid");
  if(!gridList.length && !pinned){
    empty.style.display = "block";
    grid.innerHTML      = "";
    return;
  }
  empty.style.display = "none";

  grid.innerHTML = gridList.map(a => {
    const bg      = CAMPUS_GRADIENTS[a.campus] || "linear-gradient(135deg,#6b7280,#374151)";
    const catInfo = CATEGORY_COLORS[a.category] || { cls:"tag-other", emoji:"📌" };
    return `
      <div class="news-card" onclick="openArticle('${a.id}')">
        ${a.cover_image
          ? `<img class="news-card-img" src="${esc(a.cover_image)}" alt="${esc(a.title)}" loading="lazy" />`
          : `<div class="news-card-img-placeholder" style="background:${bg}">${placeholderEmoji(a.category)}</div>`
        }
        <div class="news-card-body">
          <div class="news-card-tags">
            ${a.category ? `<span class="tag-badge ${catInfo.cls}">${catInfo.emoji} ${esc(a.category)}</span>` : ""}
            ${a.campus && a.campus !== "All" ? `<span class="tag-badge tag-campus">📍 ${esc(a.campus)}</span>` : ""}
          </div>
          <div class="news-card-title">${a.pinned ? "📌 " : ""}${esc(a.title)}</div>
          <div class="news-card-subtitle">${esc(a.subtitle || "")}</div>
          <div class="news-card-meta">
            ${a.author ? `<span>✍️ ${esc(a.author)}</span>` : ""}
            ${a.created_at ? `<span>📅 ${formatDate(a.created_at)}</span>` : ""}
          </div>
        </div>
      </div>`;
  }).join("");
}

/* ── Article modal ── */
function openArticle(id){
  const a = allArticles.find(x => x.id === id);
  if(!a) return;

  const bg      = CAMPUS_GRADIENTS[a.campus] || "linear-gradient(135deg,#6b7280,#374151)";
  const catInfo = CATEGORY_COLORS[a.category] || { cls:"tag-other", emoji:"📌" };

  document.getElementById("articleModalContent").innerHTML = `
    ${a.cover_image
      ? `<img class="article-cover" src="${esc(a.cover_image)}" alt="${esc(a.title)}" />`
      : `<div class="article-cover-placeholder" style="background:${bg}">${placeholderEmoji(a.category)}</div>`
    }
    <div class="article-body">
      <div class="article-tags">
        ${a.category ? `<span class="tag-badge ${catInfo.cls}">${catInfo.emoji} ${esc(a.category)}</span>` : ""}
        ${a.campus && a.campus !== "All" ? `<span class="tag-badge tag-campus">📍 ${esc(a.campus)}</span>` : ""}
        ${a.pinned ? `<span class="tag-badge" style="background:#fef3c7;color:#92400e;">📌 Featured</span>` : ""}
      </div>
      <div class="article-title">${esc(a.title)}</div>
      ${a.subtitle ? `<div class="article-subtitle">${esc(a.subtitle)}</div>` : ""}
      <div class="article-meta">
        ${a.author ? `<span>✍️ <strong>${esc(a.author)}</strong></span>` : ""}
        ${a.created_at ? `<span>📅 ${formatDate(a.created_at)}</span>` : ""}
      </div>
      <div class="article-content">${a.content || "<p>No content available.</p>"}</div>
    </div>`;

  document.getElementById("articleModal").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeArticle(){
  document.getElementById("articleModal").classList.remove("open");
  document.body.style.overflow = "";
}

document.getElementById("articleModal").addEventListener("click", e => {
  if(e.target === document.getElementById("articleModal")) closeArticle();
});
document.addEventListener("keydown", e => { if(e.key === "Escape") closeArticle(); });

/* ── Filter wiring ── */
document.getElementById("searchInput").addEventListener("input", e => {
  searchQuery = e.target.value.trim();
  render();
});

document.getElementById("campusSelect").addEventListener("change", e => {
  activeCampus = e.target.value;
  render();
});

document.querySelectorAll(".cat-pill").forEach(pill => {
  pill.addEventListener("click", () => {
    document.querySelectorAll(".cat-pill").forEach(p => p.classList.remove("active"));
    pill.classList.add("active");
    activeCategory = pill.dataset.cat;
    render();
  });
});

/* ── Init ── */
loadNews();
</script>

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {

      .then(reg => console.log("[PWA] Service worker registered:", reg.scope))
      .catch(err => console.warn("[PWA] Service worker failed:", err));
  });
}
</script>
