  <style>
    /* ===== DESIGN TOKENS ===== */
    :root {
      --aku-navy:       #000060;
      --aku-navy-dark:  #00004a;
      --aku-navy-light: rgba(0,0,96,.06);
      --aku-blue:       #2563eb;
      --color-bg:        #f4f6f9;
      --color-surface:   #ffffff;
      --color-surface-2: #f8fafc;
      --color-border:    #e2e8f0;
      --color-border-2:  #cbd5e1;
      --color-ink:   #0f172a;
      --color-muted: #64748b;
      --color-hint:  #94a3b8;
      --color-accent:     #2563eb;
      --color-accent-bg:  #eff6ff;
      --color-danger:     #ef4444;
      --color-danger-bg:  #fef2f2;
      --color-success:    #10b981;
      --color-success-bg: #f0fdf4;
      --color-warning:    #f59e0b;
      --color-warning-bg: #fffbeb;
      --radius-sm:   6px;
      --radius-md:   10px;
      --radius-lg:   16px;
      --radius-xl:   24px;
      --radius-pill: 9999px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,.08);
      --shadow-lg: 0 16px 40px rgba(0,0,0,.12);
      --text-xs:   11px;
      --text-sm:   12px;
      --text-base: 13px;
      --text-md:   14px;
      --text-lg:   18px;
      --text-xl:   24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    input, select, button, textarea { font-family: inherit; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body { font-family: 'Poppins', sans-serif; background: var(--color-bg); color: var(--color-ink); min-height: 100vh; }

    /* ===== TOPBAR ===== */
    .topbar {
      height: 56px;
      background: var(--aku-navy);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 0 rgba(255,255,255,.06);
    }
    .brand { color: white; font-size: 17px; font-weight: 700; letter-spacing: .3px; }
    .nav-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      color: white;
      border-radius: var(--radius-sm);
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .nav-toggle:focus-visible { outline: 2px solid rgba(255,255,255,.5); outline-offset: 2px; }

    /* ===== LAYOUT ===== */
    .shell { display: grid; grid-template-columns: 160px 1fr; min-height: calc(100vh - 56px); }

    /* ===== SIDEBAR ===== */
    .nav {
      background: var(--color-surface);
      border-right: 0.5px solid var(--color-border);
      padding: 16px 8px;
      width: 160px;
    }
    .nav a {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      margin: 1px 0;
      border-radius: var(--radius-md);
      color: var(--color-muted);
      text-decoration: none;
      font-size: var(--text-base);
      font-weight: 500;
      transition: background .15s, color .15s;
    }
    .nav a:hover:not(.active) { background: var(--color-bg); color: var(--color-ink); }
    .nav a.active {
      background: var(--aku-navy-light);
      color: var(--aku-navy);
      font-weight: 600;
      border-left: 3px solid var(--aku-navy);
      padding-left: 9px;
    }
    .nav a.hub-link { color: #7c3aed; font-weight: 700; }
    .nav a.hub-link:hover { background: #f5f3ff; }
    .nav a:focus-visible { outline: 2px solid var(--aku-navy); outline-offset: 2px; }

    /* ===== CONTENT ===== */
    .content { padding: 24px; min-width: 0; overflow-x: hidden; }

    .page-header { margin-bottom: 24px; }
    .page-title { font-size: var(--text-xl); font-weight: 700; color: var(--color-ink); margin-bottom: 4px; }
    .page-subtitle { font-size: var(--text-md); color: var(--color-muted); }

    /* ===== SEARCH ===== */
    .search-row { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
    .search-row input {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-family: 'Poppins', sans-serif;
      font-size: var(--text-base);
      color: var(--color-ink);
      background: var(--color-surface);
      box-shadow: var(--shadow-sm);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-row input:focus {
      border-color: var(--aku-navy);
      box-shadow: 0 0 0 3px var(--aku-navy-light);
    }
    .search-row input::placeholder { color: var(--color-hint); }

    /* ===== FILTER CHIPS ===== */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .filter-chip {
      padding: 5px 14px;
      border-radius: 4px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      font-family: 'Poppins', sans-serif;
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .15s;
      color: var(--color-muted);
      white-space: nowrap;
    }
    .filter-chip:hover:not(.active) { background: var(--color-bg); color: var(--color-ink); border-color: var(--color-border-2); }
    .filter-chip.active { background: var(--aku-navy); border-color: var(--aku-navy); color: white; }
    .filter-chip:focus-visible { outline: 2px solid var(--aku-navy); outline-offset: 2px; }

    /* ===== CATEGORY ===== */
    .category-section { margin-bottom: 28px; }
    .category-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .category-icon {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .category-title { font-size: var(--text-md); font-weight: 700; color: var(--color-ink); }

    /* ===== RESOURCE CARDS ===== */
    .resources-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .resource-card {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      border: 0.5px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: transform .15s, box-shadow .15s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }
    .resource-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .resource-card:focus-visible { outline: 2px solid var(--aku-navy); outline-offset: 2px; }
    .resource-card-body { padding: 16px 18px; flex: 1; }
    .resource-card-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 10px;
    }
    .resource-card-title { font-size: var(--text-md); font-weight: 700; color: var(--color-ink); margin-bottom: 5px; }
    .resource-card-desc { font-size: var(--text-sm); color: var(--color-muted); line-height: 1.6; }
    .resource-card-footer {
      border-top: 0.5px solid var(--color-border);
      padding: 9px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: var(--text-xs);
      color: var(--color-muted);
    }
    .resource-arrow {
      width: 26px;
      height: 26px;
      background: var(--color-accent-bg);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-accent);
      font-size: var(--text-base);
      font-weight: 700;
    }

    /* ===== EMPTY STATE ===== */
    .empty { text-align: center; padding: 60px 20px; color: var(--color-muted); }
    .empty-icon { font-size: 32px; opacity: .5; margin-bottom: 12px; }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--color-surface);
      border-top: 0.5px solid var(--color-border);
      box-shadow: 0 -2px 8px rgba(0,0,0,.06);
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-nav-inner { display: flex; }
    .bottom-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 2px 6px;
      font-size: 9px;
      font-weight: 600;
      color: var(--color-muted);
      text-decoration: none;
      gap: 3px;
      transition: color .15s;
    }
    .bottom-nav-item.active { color: var(--aku-navy); }
    .bottom-nav-item.hub { color: #7c3aed; }
    .bottom-nav-item:focus-visible { outline: 2px solid var(--aku-navy); outline-offset: -2px; }

    /* ===== RESPONSIVE ===== */
    @media(max-width: 768px) {
      .shell { display: block; }
      .nav {
        display: none;
        position: fixed;
        top: 56px; left: 0;
        width: 220px;
        height: calc(100vh - 56px);
        z-index: 99;
        box-shadow: var(--shadow-lg);
        overflow-y: auto;
      }
      .nav.open { display: block; }
      .nav-toggle { display: flex; }
      .bottom-nav { display: block; }
      .content { padding: 16px 16px 88px; }
      .resources-grid { grid-template-columns: 1fr; }
      .page-title { font-size: var(--text-lg); }
    }
  </style>
</head>

<script>
// Nav toggle with accessibility
document.getElementById('navToggle').addEventListener('click', function() {
  const nav = document.getElementById('sideNav');
  const isOpen = nav.classList.toggle('open');
  this.setAttribute('aria-expanded', String(isOpen));
});

const sb = supabase.createClient("https://dgzuqvffnbfybngoadse.supabase.co","sb_publishable_77t5gCD7M620CzcMwESN-A_oAuqz6B8");
const CATEGORY_STYLES = { "Forms":{bg:"#eff6ff",icon:"📋",color:"#2563eb"},"Portals":{bg:"#f5f3ff",icon:"🌐",color:"#7c3aed"},"Health & Wellness":{bg:"#f0fdf4",icon:"💚",color:"#16a34a"},"Academic":{bg:"#fef9c3",icon:"📚",color:"#ca8a04"},"Student Affairs":{bg:"#fdf4ff",icon:"🎓",color:"#a21caf"},"Finance":{bg:"#fff7ed",icon:"💰",color:"#ea580c"},"IT & Technology":{bg:"#f0fdfa",icon:"💻",color:"#0891b2"},"Policies":{bg:"#fef2f2",icon:"📜",color:"#dc2626"} };
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
let allResources=[], activeCampus="", activeSearch="";

async function loadResources(){
  const { data } = await sb.from("resources").select("*").eq("is_active",true).order("display_order").order("title");
  // Only show resources meant for the public site. Event-Hub-only resources
  // (visibility='event_hub') must never appear here. Rows created before the
  // visibility column existed have no value → treated as public (unchanged).
  allResources = (data || []).filter(r => !r.visibility || r.visibility === "public" || r.visibility === "both");
  render(allResources);
}

function filterCampus(campus, btn){
  activeCampus = campus;
  document.querySelectorAll(".filter-chip").forEach(c=>c.classList.remove("active"));
  btn.classList.add("active");
  applyFilters();
}

function applyFilters(q){
  if(q !== undefined) activeSearch = q.toLowerCase();
  let f = allResources;
  if(activeCampus) f = f.filter(r=>!r.campus||r.campus===activeCampus);
  if(activeSearch) f = f.filter(r=>(r.title||"").toLowerCase().includes(activeSearch)||(r.description||"").toLowerCase().includes(activeSearch)||(r.category||"").toLowerCase().includes(activeSearch));
  render(f);
}

function render(resources){
  const container = document.getElementById("resourcesContainer");
  if(!resources.length){ container.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div><div>No resources found.</div></div>`; return; }
  const groups={};
  resources.forEach(r=>{ const cat=r.category||"General"; if(!groups[cat])groups[cat]=[]; groups[cat].push(r); });
  container.innerHTML = Object.entries(groups).map(([cat,items])=>{
    const style=CATEGORY_STYLES[cat]||{bg:"#f3f4f6",icon:"🔗",color:"#374151"};
    return `<div class="category-section">
      <div class="category-header">
        <div class="category-icon" style="background:${style.bg};">${style.icon}</div>
        <div class="category-title">${esc(cat)}</div>
      </div>
      <div class="resources-grid">${items.map(r=>{
        const icon=r.icon||style.icon;
        const tag=r.url?"a":"div";
        const href=r.url?`href="${esc(r.url)}" target="_blank" rel="noopener"`:"";
        return `<${tag} ${href} class="resource-card">
          <div class="resource-card-body">
            <div class="resource-card-icon" style="background:${style.bg};">${icon}</div>
            <div class="resource-card-title">${esc(r.title)}</div>
            ${r.description?`<div class="resource-card-desc">${esc(r.description)}</div>`:""}
          </div>
          <div class="resource-card-footer">
            <span>${r.campus?`📍 ${esc(r.campus)}`:"🌐 All Campuses"}</span>
            ${r.url?`<div class="resource-arrow">→</div>`:""}
          </div>
        </${tag}>`;
      }).join("")}</div>
    </div>`;
  }).join("");
}
loadResources();
</script>
</body>
</html>
