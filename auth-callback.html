<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Life — Please wait…</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{ font-family:'Poppins',sans-serif; background:#f8fafc; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card{ background:white; border-radius:16px; padding:40px 32px; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,.08); max-width:360px; width:90%; }
    .logo{ width:56px; height:56px; background:#000060; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 20px; }
    h1{ font-size:18px; font-weight:600; margin-bottom:8px; color:#0f172a; }
    p{ font-size:13px; color:#64748b; line-height:1.6; }
    .spinner{ width:32px; height:32px; border:3px solid #e2e8f0; border-top-color:#000060; border-radius:50%; animation:spin .8s linear infinite; margin:20px auto 0; }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    .error-box{ display:none; background:#fef2f2; border:1px solid #fecaca; border-radius:10px; padding:14px; margin-top:16px; font-size:13px; color:#dc2626; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">🎓</div>
  <h1>Authenticating…</h1>
  <p id="statusMsg">Please wait while we verify your identity.</p>
  <div class="spinner" id="spinner"></div>
  <div class="error-box" id="errorBox"></div>
</div>

<script>
function showError(msg){
  document.getElementById("spinner").style.display = "none";
  const box = document.getElementById("errorBox");
  box.textContent = msg;
  box.style.display = "block";
  document.getElementById("statusMsg").textContent = "Something went wrong.";
}

function handleCallback(){
  const hash   = window.location.hash;
  const params = new URLSearchParams(hash.replace("#",""));
  const at     = params.get("access_token");
  const rt     = params.get("refresh_token") || "";
  const type   = params.get("type") || "recovery";

  const next   = new URLSearchParams(window.location.search).get("next") || "admin";
  const dest   = next === "hub" ? "/event-hub.html" : "/admin.html";

  if(!at){
    // No token — just redirect normally
    window.location.replace(dest);
    return;
  }

  // Store tokens in sessionStorage so the destination page can use them
  // with its own Supabase client and storage key
  try {
    sessionStorage.setItem("aku_auth_callback", JSON.stringify({ at, rt, type, next }));
    document.getElementById("statusMsg").textContent = "Verified! Redirecting…";
    setTimeout(() => window.location.replace(dest), 700);
  } catch(e) {
    showError("Could not store session. Please try again or contact support.");
  }
}

handleCallback();
</script>
</body>
</html>
