<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000060" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Life on Campus" />
  <link rel="apple-touch-icon" href="https://studentexperience.github.io/icon-192.png" />
  <title>Life on Campus · Emergency Contacts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ===== DESIGN TOKENS ===== */
    :root {
      --aku-navy:       #000060;
      --aku-navy-dark:  #00004a;
      --aku-navy-light: rgba(0,0,96,.06);
      --aku-blue:       #2563eb;
      --color-bg:        #f4f6f9;
      --color-surface:   #ffffff;
      --color-surface-2: #f8fafc;
      --color-border:    #e2e8f0;
      --color-border-2:  #cbd5e1;
      --color-ink:   #0f172a;
      --color-muted: #64748b;
      --color-hint:  #94a3b8;
      --color-accent:     #2563eb;
      --color-accent-bg:  #eff6ff;
      --color-danger:     #ef4444;
      --color-danger-bg:  #fef2f2;
      --color-success:    #10b981;
      --color-success-bg: #f0fdf4;
      --color-warning:    #f59e0b;
      --color-warning-bg: #fffbeb;
      --radius-sm:   6px;
      --radius-md:   10px;
      --radius-lg:   16px;
      --radius-xl:   24px;
      --radius-pill: 9999px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,.08);
      --shadow-lg: 0 16px 40px rgba(0,0,0,.12);
      --text-xs:   11px;
      --text-sm:   12px;
      --text-base: 13px;
      --text-md:   14px;
      --text-lg:   18px;
      --text-xl:   24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body { font-family: 'Poppins', sans-serif; background: var(--color-bg); color: var(--color-ink); min-height: 100vh; }

    /* ===== TOPBAR ===== */
    .topbar {
      height: 56px;
      background: var(--aku-navy);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 0 rgba(255,255,255,.06);
    }
    .brand { color: white; font-size: 17px; font-weight: 700; letter-spacing: .3px; }
    .nav-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      color: white;
      border-radius: var(--radius-sm);
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .nav-toggle:focus-visible { outline: 2px solid rgba(255,255,255,.5); outline-offset: 2px; }

    /* ===== LAYOUT ===== */
    .shell { display: grid; grid-template-columns: 160px 1fr; min-height: calc(100vh - 56px); }

    /* ===== SIDEBAR ===== */
    .nav {
      background: var(--color-surface);
      border-right: 0.5px solid var(--color-border);
      padding: 16px 8px;
      width: 160px;
    }
    .nav a {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      margin: 1px 0;
      border-radius: var(--radius-md);
      color: var(--color-muted);
      text-decoration: none;
      font-size: var(--text-base);
      font-weight: 500;
      transition: background .15s, color .15s;
    }
    .nav a:hover:not(.active) { background: var(--color-bg); color: var(--color-ink); }
    .nav a.active {
      background: var(--aku-navy-light);
      color: var(--aku-navy);
      font-weight: 600;
      border-left: 3px solid var(--aku-navy);
      padding-left: 9px;
    }
    .nav a.hub-link {
      color: #7c3aed;
      font-weight: 700;
    }
    .nav a.hub-link:hover { background: #f5f3ff; }
    .nav a:focus-visible { outline: 2px solid var(--aku-navy); outline-offset: 2px; }

    /* ===== CONTENT ===== */
    .content { padding: 24px; min-width: 0; overflow-x: hidden; }

    .page-header { margin-bottom: 24px; }
    .page-title { font-size: var(--text-xl); font-weight: 700; color: var(--color-ink); margin-bottom: 4px; }
    .page-subtitle { font-size: var(--text-md); color: var(--color-muted); }

    /* ===== EMERGENCY BANNER ===== */
    .emergency-banner {
      background: var(--color-danger-bg);
      border: 0.5px solid #fca5a5;
      border-left: 4px solid var(--color-danger);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .emergency-banner-icon {
      width: 44px;
      height: 44px;
      background: #fee2e2;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--color-danger);
    }
    .emergency-banner-text { flex: 1; min-width: 150px; }
    .emergency-banner-text h2 { font-size: var(--text-md); font-weight: 700; color: #b91c1c; margin-bottom: 2px; }
    .emergency-banner-text p { font-size: var(--text-sm); color: #991b1b; }
    .emergency-number {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--color-danger);
      color: white;
      border-radius: var(--radius-md);
      padding: 10px 20px;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: var(--text-base);
      box-shadow: var(--shadow-sm);
      transition: background .15s;
      white-space: nowrap;
      min-width: 140px;
    }
    .emergency-number:hover { background: #dc2626; }
    .emergency-number:focus-visible { outline: 2px solid var(--color-danger); outline-offset: 2px; }

    /* ===== SEARCH ===== */
    .search-wrap { margin-bottom: 14px; }
    .search-wrap input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-family: 'Poppins', sans-serif;
      font-size: var(--text-base);
      color: var(--color-ink);
      background: var(--color-surface);
      box-shadow: var(--shadow-sm);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-wrap input:focus {
      border-color: var(--aku-navy);
      box-shadow: 0 0 0 3px var(--aku-navy-light);
    }
    .search-wrap input::placeholder { color: var(--color-hint); }

    /* ===== FILTER CHIPS ===== */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      padding: 5px 14px;
      border-radius: 4px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      font-family: 'Poppins', sans-serif;
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .15s;
      color: var(--color-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .filter-chip:hover:not(.active) { background: var(--color-bg); color: var(--color-ink); border-color: var(--color-border-2); }
    .filter-chip.active { background: var(--aku-navy); border-color: var(--aku-navy); color: white; }
    .filter-chip:focus-visible { outline: 2px solid var(--aku-navy); outline-offset: 2px; }

    /* ===== CATEGORY ===== */
    .category-section { margin-bottom: 24px; }
    .category-label {
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--color-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .category-label::after { content: ""; flex: 1; height: 0.5px; background: var(--color-border); }

    /* ===== CONTACT CARDS ===== */
    .contacts-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media(min-width: 500px) { .contacts-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); } }

    .contact-card {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      border: 0.5px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow .15s;
    }
    .contact-card:hover { box-shadow: var(--shadow-md); }
    .contact-card-top { padding: 14px 16px 12px; display: flex; align-items: center; gap: 12px; }
    .contact-avatar {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .contact-name { font-size: var(--text-base); font-weight: 700; color: var(--color-ink); margin-bottom: 2px; }
    .contact-role { font-size: var(--text-xs); color: var(--color-muted); }
    .contact-dept { font-size: var(--text-xs); color: var(--color-hint); margin-top: 1px; }
    .contact-actions { border-top: 0.5px solid var(--color-border); display: flex; }
    .contact-action {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 10px 6px;
      font-size: var(--text-xs);
      font-weight: 600;
      text-decoration: none;
      color: var(--color-muted);
      transition: background .15s;
    }
    .contact-action:hover { background: var(--color-bg); }
    .contact-action.call { color: #16a34a; }
    .contact-action.email-btn { color: var(--color-accent); }
    .contact-action:not(:last-child) { border-right: 0.5px solid var(--color-border); }
    .contact-action:focus-visible { outline: 2px solid var(--aku-navy); outline-offset: -2px; }

    /* ===== EMPTY STATE ===== */
    .empty { text-align: center; padding: 48px 20px; color: var(--color-muted); }
    .empty-icon { font-size: 32px; opacity: .5; margin-bottom: 12px; }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--color-surface);
      border-top: 0.5px solid var(--color-border);
      box-shadow: 0 -2px 8px rgba(0,0,0,.06);
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-nav-inner { display: flex; }
    .bottom-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 4px 6px;
      font-size: 9px;
      font-weight: 600;
      color: var(--color-muted);
      text-decoration: none;
      gap: 3px;
      transition: color .15s;
    }
    .bottom-nav-item.active { color: var(--aku-navy); }
    .bottom-nav-item:focus-visible { outline: 2px solid var(--aku-navy); outline-offset: -2px; }

    /* ===== RESPONSIVE ===== */
    @media(max-width: 768px) {
      .shell { display: block; }
      .nav {
        display: none;
        position: fixed;
        top: 56px; left: 0;
        width: 220px;
        height: calc(100vh - 56px);
        z-index: 99;
        box-shadow: var(--shadow-lg);
        overflow-y: auto;
      }
      .nav.open { display: block; }
      .nav-toggle { display: flex; }
      .bottom-nav { display: block; }
      .content { padding: 16px 16px 88px; }
      .page-title { font-size: var(--text-lg); }
      .emergency-banner { gap: 12px; }
    }
  </style>
</head>

    <a href="emergency-contacts.html" class="bottom-nav-item active" aria-label="Emergency contacts" aria-current="page">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2"/>
        <path d="M15 7a2 2 0 0 1 2 2"/><path d="M15 3a6 6 0 0 1 6 6"/>
      </svg>
      <span>Emergency</span>
    </a>
  </div>
</nav>

<script>
// Nav toggle with accessibility
document.getElementById('navToggle').addEventListener('click', function() {
  const nav = document.getElementById('sideNav');
  const isOpen = nav.classList.toggle('open');
  this.setAttribute('aria-expanded', String(isOpen));
});

const sb = supabase.createClient("https://dgzuqvffnbfybngoadse.supabase.co","sb_publishable_77t5gCD7M620CzcMwESN-A_oAuqz6B8");
const CATEGORY_COLORS = { "Medical":{bg:"#fef2f2",icon:"🏥",color:"#dc2626"},"Security":{bg:"#fffbeb",icon:"🛡️",color:"#d97706"},"Counselling":{bg:"#f0fdf4",icon:"💚",color:"#16a34a"},"Admin":{bg:"#eff6ff",icon:"🏛️",color:"#2563eb"},"IT Support":{bg:"#f5f3ff",icon:"💻",color:"#7c3aed"},"Facilities":{bg:"#fef9c3",icon:"🔧",color:"#ca8a04"},"Office of Student Experience Pakistan":{bg:"#fdf4ff",icon:"🎓",color:"#a21caf"} };
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
let allContacts=[], activeCampus="", activeSearch="";

function applyContactFilters(){
  let filtered = allContacts;
  if(activeCampus) filtered = filtered.filter(c => !c.campus || c.campus === activeCampus);
  if(activeSearch)  filtered = filtered.filter(c =>
    (c.name||"").toLowerCase().includes(activeSearch) ||
    (c.role||"").toLowerCase().includes(activeSearch) ||
    (c.department||"").toLowerCase().includes(activeSearch) ||
    (c.category||"").toLowerCase().includes(activeSearch) ||
    (c.phone||"").includes(activeSearch)
  );
  render(filtered);
}

function searchContacts(q){
  activeSearch = q.toLowerCase();
  applyContactFilters();
}

async function init(){
  const { data: settings } = await sb.from("site_settings").select("value").eq("key","emergency_number").single();
  const num = settings?.value || "";
  const link = document.getElementById("emergencyNumberLink");
  if(num){
    const parts = num.split(":");
    if(parts.length >= 2){
      const label  = parts[0].trim();
      const number = parts.slice(1).join(":").trim();
      const digits = number.replace(/[^0-9+]/g,"");
      link.innerHTML = `<span style="display:block;font-size:11px;font-weight:600;opacity:.8;margin-bottom:2px;">${label}</span><span style="display:block;font-size:15px;font-weight:800;">📞 ${number}</span>`;
      link.href = digits ? "tel:" + digits : "#";
    } else {
      link.innerHTML = `<span style="font-size:15px;font-weight:800;">📞 ${num}</span>`;
      link.href = "tel:" + num.replace(/[^0-9+]/g,"");
    }
  } else {
    link.textContent = "📞 Contact Admin";
    link.removeAttribute("href");
  }

  const { data } = await sb.from("emergency_contacts").select("*").eq("is_active",true).order("display_order").order("name");
  allContacts = data || [];
  render(allContacts);
}

function filterCampus(campus, btn){
  activeCampus = campus;
  document.querySelectorAll(".filter-chip").forEach(c=>c.classList.remove("active"));
  btn.classList.add("active");
  applyContactFilters();
}

function render(contacts){
  const container = document.getElementById("contactsContainer");
  if(!contacts.length){ container.innerHTML=`<div class="empty"><div class="empty-icon">📋</div><div>No contacts found for this campus.</div></div>`; return; }
  const groups={};
  contacts.forEach(c=>{ const cat=c.category||"General"; if(!groups[cat])groups[cat]=[]; groups[cat].push(c); });
  container.innerHTML = Object.entries(groups).map(([cat,items])=>{
    const style=CATEGORY_COLORS[cat]||{bg:"#f3f4f6",icon:"📞",color:"#374151"};
    return `<div class="category-section">
      <div class="category-label">${style.icon} ${esc(cat)}</div>
      <div class="contacts-grid">${items.map(c=>{
        const call=c.phone?`<a href="tel:${esc(c.phone)}" class="contact-action call"><span>📞</span>${esc(c.phone)}</a>`:"";
        const mail=c.email?`<a href="mailto:${esc(c.email)}" class="contact-action email-btn"><span>✉️</span>Email</a>`:"";
        return `<div class="contact-card">
          <div class="contact-card-top">
            <div class="contact-avatar" style="background:${style.bg};">${style.icon}</div>
            <div>
              <div class="contact-name">${esc(c.name)}</div>
              ${c.role?`<div class="contact-role">${esc(c.role)}</div>`:""}
              ${c.department?`<div class="contact-dept">🏢 ${esc(c.department)}</div>`:""}
              ${c.campus?`<div class="contact-dept">📍 ${esc(c.campus)}</div>`:""}
            </div>
          </div>
          ${call||mail?`<div class="contact-actions">${call}${mail}</div>`:""}
        </div>`;
      }).join("")}</div>
    </div>`;
  }).join("");
}
init();
</script>
</body>
</html>
